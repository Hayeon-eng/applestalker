name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 — Render 무료 플랜 15분 idle 슬립 방지
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS --max-time 30 \
            "${{ secrets.BACKEND_URL }}/api/health" \
            -w "\nHTTP %{http_code}\n" || echo "ping failed (다음 주기에 재시도)"
