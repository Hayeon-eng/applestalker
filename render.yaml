# 참고용. Render Dashboard 에서 New + 로 직접 생성 권장.
services:
  - type: web
    name: apple-stalker-backend
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt  # [2026-09] 렌더 기본 OFF — 필요 시 "&& python -m playwright install chromium" 복원
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.0 }
      - { key: DATABASE_URL, sync: false }
      - { key: CRON_TOKEN, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash }
      - { key: USE_PLAYWRIGHT, value: "false" }   # [2026-09] 렌더 기본 OFF(코드는 유지, 켜면 재활성)
      - { key: ENABLE_SCREENSHOT, value: "false" }
      - { key: JS_RESCUE, value: "false" }
      - { key: QB_SPEC_API, value: "true" }          # Compare 스펙 = searchapi spec/compare
      - { key: QB_SPEC_RESCUE_CAP, value: "0" }
      - { key: KEEP_SNAPSHOTS, value: "5" }
      # [속도 튜닝 — 한 단계씩 상향, collection failed 건수 모니터링하며 조절]
      - { key: QB_RUN_CONCURRENCY, value: "8" }       # 기본 6 → 8
      - { key: QB_BROWSER_CONCURRENCY, value: "2" }   # 기본 1 → 2 (512MB 메모리 주의)
      - { key: EMAIL_REPORT_ENABLED, value: "true" }
      - { key: SMTP_SERVER, value: smtp.naver.com }
      - { key: SMTP_PORT, value: "587" }
      - { key: SENDER_EMAIL, sync: false }
      - { key: SENDER_PASSWORD, sync: false }
      - { key: RECIPIENT_EMAIL, sync: false }
  - type: web
    name: apple-stalker-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - { key: NODE_VERSION, value: 20.x }
      - { key: NEXT_PUBLIC_API_URL, sync: false }
databases:
  - name: apple-stalker-db
    plan: free
