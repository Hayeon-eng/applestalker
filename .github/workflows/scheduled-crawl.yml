name: scheduled-crawl

on:
  schedule:
    - cron: "0 0 * * 1"   # Every Monday 09:00 KST
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend and run crawl
        run: |
          test -n "${{ secrets.BACKEND_URL }}" || (echo "BACKEND_URL secret is missing" && exit 1)
          test -n "${{ secrets.CRON_TOKEN }}" || (echo "CRON_TOKEN secret is missing" && exit 1)
          curl -fsS --retry 2 --retry-delay 10 --max-time 900 \
            "${{ secrets.BACKEND_URL }}/api/cron/tick?token=${{ secrets.CRON_TOKEN }}"
