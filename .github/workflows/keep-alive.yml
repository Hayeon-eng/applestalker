name: keep-alive

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend health endpoint
        run: |
          test -n "${{ secrets.BACKEND_URL }}" || (echo "BACKEND_URL secret is missing" && exit 1)
          curl -fsS --retry 2 --retry-delay 5 --max-time 30 \
            "${{ secrets.BACKEND_URL }}/api/health"

      - name: Wake frontend
        run: |
          test -n "${{ secrets.FRONTEND_URL }}" || (echo "FRONTEND_URL secret is missing" && exit 1)
          curl -fsS --retry 2 --retry-delay 5 --max-time 30 \
            "${{ secrets.FRONTEND_URL }}"
