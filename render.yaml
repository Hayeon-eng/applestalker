services:
  # Backend Service
  - type: web
    name: apple-tracker-backend
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt && playwright install chromium --no-shell
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Render PostgreSQL 에서 설정
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CRAWL_SCHEDULE
        value: "0 0,5 * * *"
      - key: SMTP_SERVER
        value: smtp.naver.com
      - key: SMTP_PORT
        value: "587"
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: EMAIL_REPORT_ENABLED
        value: "true"
      - key: USE_PLAYWRIGHT
        value: "true"  # 이미지 추출을 위해 Playwright 사용
      - key: MAX_CONCURRENT_CRAWLS
        value: "3"  # 동시 크롤링 수 (안정성 우선)
      - key: CRAWL_TIMEOUT
        value: "60000"  # 60 초 타임아웃 (이미지 로딩 고려)
      - key: ENABLE_FULL_SITE_CRAWL
        value: "true"  # 전체 사이트 크롤링 활성화
      - key: NEXT_PUBLIC_API_URL
        value: https://apple-tracker-backend.onrender.com  # 프론트엔드에서 사용

  # Frontend Service (Next.js)
  - type: web
    name: apple-tracker-frontend
    env: node
    region: singapore
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        sync: false  # 백엔드 URL 입력

  # PostgreSQL Database (Render Free)
  - type: pserv
    name: apple-tracker-db
    env: postgres
    region: singapore
    plan: free
    database:
      name: appletracker
      dbName: appletracker
      user: appletracker
    disk:
      sizeGB: 10  # 무료 플랜 10GB

envVars:
  - key: APP_ENV
    value: production
