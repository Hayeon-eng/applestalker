name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 — Render 무료 플랜 15분 idle 슬립 방지
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend
        run: |
          test -n "${{ secrets.BACKEND_URL }}" || (echo "BACKEND_URL secret 누락" && exit 1)
          curl -fsS --retry 2 --retry-delay 5 --max-time 30 \
            "${{ secrets.BACKEND_URL }}/api/health" \
            || echo "ping failed (다음 주기에 재시도)"

      - name: Wake frontend
        run: |
          test -n "${{ secrets.FRONTEND_URL }}" || (echo "FRONTEND_URL secret 누락 — skip" && exit 0)
          curl -fsS --retry 2 --retry-delay 5 --max-time 30 \
            "${{ secrets.FRONTEND_URL }}" \
            || echo "frontend ping failed"
