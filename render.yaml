# =====================================================
# Apple Tracker - Render 배포 설정 (참고용)
# =====================================================
# 이 파일은 Render Blueprint 용이 아닌 참고용 설정입니다.
# 실제 배포는 Render Dashboard 에서 New Service 로 직접 생성하세요.
# =====================================================

services:
  # Backend Service (참고용)
  - type: web
    name: apple-tracker-backend
    env: python
    region: oregon-west
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt && playwright install chromium --no-shell
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false  # Render Dashboard 에서 직접 입력
      - key: GEMINI_API_KEY
        sync: false  # Render Dashboard 에서 직접 입력
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CRAWL_SCHEDULE
        value: "0 0,5 * * *"
      - key: SMTP_SERVER
        value: smtp.naver.com
      - key: SMTP_PORT
        value: "587"
      - key: SENDER_EMAIL
        sync: false  # Render Dashboard 에서 직접 입력
      - key: SENDER_PASSWORD
        sync: false  # Render Dashboard 에서 직접 입력
      - key: RECIPIENT_EMAIL
        sync: false  # Render Dashboard 에서 직접 입력
      - key: EMAIL_REPORT_ENABLED
        value: "true"
      - key: USE_PLAYWRIGHT
        value: "true"
      - key: MAX_CONCURRENT_CRAWLS
        value: "3"
      - key: CRAWL_TIMEOUT
        value: "60000"
      - key: ENABLE_FULL_SITE_CRAWL
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        value: https://apple-tracker-backend.onrender.com

  # Frontend Service (참고용)
  - type: web
    name: apple-tracker-frontend
    env: node
    region: oregon-west
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_URL
        sync: false  # Render Dashboard 에서 직접 입력
